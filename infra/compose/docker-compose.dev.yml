services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-g18_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-g18_app}
      MYSQL_USER: ${MYSQL_USER:-g18}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-g18_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_dev_data:
