services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      AI_DIAGNOSIS_ENDPOINT: ${AI_DIAGNOSIS_ENDPOINT:-}
      AI_DIAGNOSIS_API_KEY: ${AI_DIAGNOSIS_API_KEY:-}
      AI_QUESTION_ENDPOINT: ${AI_QUESTION_ENDPOINT:-}
      AI_QUESTION_API_KEY: ${AI_QUESTION_API_KEY:-}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  api-migrate:
    image: ${API_IMAGE}
    restart: "no"
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_DIAGNOSIS_ENDPOINT: ${AI_DIAGNOSIS_ENDPOINT:-}
      AI_DIAGNOSIS_API_KEY: ${AI_DIAGNOSIS_API_KEY:-}
      AI_QUESTION_ENDPOINT: ${AI_QUESTION_ENDPOINT:-}
      AI_QUESTION_API_KEY: ${AI_QUESTION_API_KEY:-}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  mysql_prod_data:
