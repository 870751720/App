name: Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            image_suffix: web
          - app: api
            dockerfile: apps/api/Dockerfile
            image_suffix: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        run: |
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DATABASE_URL" ] || [ -z "$JWT_SECRET" ] || [ -z "$MYSQL_PASSWORD" ] || [ -z "$MYSQL_ROOT_PASSWORD" ]; then
            echo "::notice::Deployment skipped because one or more required deployment secrets are not configured."
            echo "DEPLOY_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Write production environment
        if: env.DEPLOY_SKIPPED != 'true'
        env:
          API_HOST: ${{ vars.API_HOST || '0.0.0.0' }}
          API_PORT: ${{ vars.API_PORT || '3001' }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
          AI_STUDENT_EMAIL: ${{ vars.AI_STUDENT_EMAIL || 'user@app.local' }}
          AI_DIAGNOSIS_API_KEY: ${{ secrets.AI_DIAGNOSIS_API_KEY }}
          AI_DIAGNOSIS_ENDPOINT: ${{ vars.AI_DIAGNOSIS_ENDPOINT }}
          AI_QUESTION_API_KEY: ${{ secrets.AI_QUESTION_API_KEY }}
          AI_QUESTION_ENDPOINT: ${{ vars.AI_QUESTION_ENDPOINT }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'app' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE || 'app' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ vars.MYSQL_USER || 'app' }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          OCR_ENDPOINT: ${{ vars.OCR_ENDPOINT }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || ':80' }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN || 'http://localhost' }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"
          test -n "$MYSQL_PASSWORD"
          test -n "$MYSQL_ROOT_PASSWORD"
          {
            printf 'COMPOSE_PROJECT_NAME=%s\n' "$COMPOSE_PROJECT_NAME"
            printf 'SITE_ADDRESS=%s\n' "$SITE_ADDRESS"
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
            printf 'MYSQL_DATABASE=%s\n' "$MYSQL_DATABASE"
            printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
            printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'WEB_ORIGIN=%s\n' "$WEB_ORIGIN"
            printf 'API_HOST=%s\n' "$API_HOST"
            printf 'API_PORT=%s\n' "$API_PORT"
            printf 'AI_ACCESS_TOKEN=%s\n' "$AI_ACCESS_TOKEN"
            printf 'AI_STUDENT_EMAIL=%s\n' "$AI_STUDENT_EMAIL"
            printf 'AI_DIAGNOSIS_ENDPOINT=%s\n' "$AI_DIAGNOSIS_ENDPOINT"
            printf 'AI_DIAGNOSIS_API_KEY=%s\n' "$AI_DIAGNOSIS_API_KEY"
            printf 'AI_QUESTION_ENDPOINT=%s\n' "$AI_QUESTION_ENDPOINT"
            printf 'AI_QUESTION_API_KEY=%s\n' "$AI_QUESTION_API_KEY"
            printf 'OCR_ENDPOINT=%s\n' "$OCR_ENDPOINT"
            printf 'OCR_API_KEY=%s\n' "$OCR_API_KEY"
            printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE"
            printf 'API_IMAGE=%s\n' "$API_IMAGE"
          } > .deploy.env

      - name: Sync deployment files
        if: env.DEPLOY_SKIPPED != 'true'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'app' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_USER"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH/infra/compose' '$DEPLOY_PATH/infra/caddy'"
          scp -P "$SERVER_PORT" infra/compose/docker-compose.prod.yml "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/infra/compose/docker-compose.prod.yml"
          scp -P "$SERVER_PORT" infra/caddy/Caddyfile "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/infra/caddy/Caddyfile"
          scp -P "$SERVER_PORT" .deploy.env "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/infra/compose/.env"

      - name: Pull and restart containers
        if: env.DEPLOY_SKIPPED != 'true'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'app' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH/infra/compose"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          EOF
